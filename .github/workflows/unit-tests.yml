name: Pruebas unitarias

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  typescript-tests:
    name: Jest — ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        package:
          - Backend/services/auth-service
          - Backend/services/catalog-service
          - Backend/services/inscripcion-service
          - Backend/services/notificaciones-service
          - Backend/api-gateway
          - Frontend
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas unitarias
        run: npm test -- --runInBand

  go-tests:
    name: Go — reproducción
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/services/reproduccion-service
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Ejecutar pruebas unitarias
        run: go test ./... -v

  python-tests:
    name: Python — analítica
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/services/analitica-service
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/services/analitica-service/requirements.txt
      - name: Crear entorno virtual e instalar dependencias
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip3 install -r requirements.txt
      - name: Ejecutar pruebas unitarias
        run: |
          source .venv/bin/activate
          python3 -m pytest -v

  typescript-build:
    name: Build TypeScript — ${{ matrix.package }}
    needs: [typescript-tests, go-tests, python-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        package:
          - Backend/services/auth-service
          - Backend/services/catalog-service
          - Backend/services/inscripcion-service
          - Backend/services/notificaciones-service
          - Backend/api-gateway
          - Frontend
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar
        run: npm run build

  go-build:
    name: Build Go — reproducción
    needs: [typescript-tests, go-tests, python-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/services/reproduccion-service
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Compilar
        run: go build ./...

  python-build:
    name: Build Python — analítica
    needs: [typescript-tests, go-tests, python-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/services/analitica-service
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar compilación
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python3 -m compileall -q src gen main.py healthcheck.py
