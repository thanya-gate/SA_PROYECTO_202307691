name: CI/CD — Pruebas, publicación y despliegue

# Pipeline de Integración Continua y Despliegue Continuo (Práctica 6):
# 1. Ejecuta las suites de pruebas unitarias ante cada PR / push.
# 2. Si todas pasan, construye y publica las imágenes Docker de los
#    8 servicios en GCP Artifact Registry con aliases y un tag inmutable.
# 3. En main o en un tag de release, actualiza la VM mediante SSH usando
#    docker compose pull; la VM nunca compila las imágenes.
# 4. En cada push a main, despliega además el tag inmutable en GKE.

on:
  push:
    branches: [main]
    # Se aceptan ambas convenciones históricas de tags de release.
    tags: ['v*', 'V*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # ------------------------------------------------------------------
  # 1. Pruebas unitarias (cortocircuito: bloquea la publicación)
  # ------------------------------------------------------------------
  tests:
    name: Pruebas — ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - package: Backend/services/auth-service
            stack: node
          - package: Backend/services/catalog-service
            stack: node
          - package: Backend/services/inscripcion-service
            stack: node
          - package: Backend/services/notificaciones-service
            stack: node
          - package: Backend/api-gateway
            stack: node
          - package: Frontend
            stack: node
          - package: Backend/services/reproduccion-service
            stack: go
          - package: Backend/services/analitica-service
            stack: python
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        if: matrix.stack == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Configurar Go
        if: matrix.stack == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Configurar Python
        if: matrix.stack == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/services/analitica-service/requirements.txt

      - name: Instalar dependencias
        if: matrix.stack == 'node'
        run: npm ci

      - name: Instalar dependencias (Python)
        if: matrix.stack == 'python'
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip3 install -r requirements.txt

      - name: Ejecutar pruebas unitarias (Jest)
        if: matrix.stack == 'node'
        run: npm test -- --runInBand

      - name: Ejecutar pruebas unitarias (Go)
        if: matrix.stack == 'go'
        run: go test ./... -v

      - name: Ejecutar pruebas unitarias (pytest)
        if: matrix.stack == 'python'
        run: |
          source .venv/bin/activate
          python3 -m pytest -v

  # ------------------------------------------------------------------
  # 2. Resolver la etiqueta que consumirá la VM
  # ------------------------------------------------------------------
  resolve-image-tag:
    name: Resolver etiqueta de despliegue
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      immutable_image_tag: ${{ steps.resolve.outputs.immutable_image_tag }}
    steps:
      - name: Resolver referencia
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF_NAME" != "main" ]]; then
              echo "::error::workflow_dispatch solo puede desplegar desde main. Referencia recibida: $REF_NAME"
              exit 1
            fi
            image_tag="main"
          elif [[ "$REF_NAME" == "main" ]]; then
            image_tag="main"
          elif [[ "$REF_NAME" =~ ^[vV]([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            image_tag="${BASH_REMATCH[1]}"
          else
            echo "::error::La referencia no corresponde a main ni a un tag semántico vX.Y.Z/VX.Y.Z: $REF_NAME"
            exit 1
          fi

          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "immutable_image_tag=commit-$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "Etiqueta de imagen seleccionada: $image_tag"
          echo "Etiqueta inmutable de imagen: commit-$COMMIT_SHA"

  # ------------------------------------------------------------------
  # 3. Build y publicación de imágenes en GCP Artifact Registry
  # ------------------------------------------------------------------
  publish:
    name: Publicar — ${{ matrix.name }}
    needs: [tests, resolve-image-tag]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.resolve-image-tag.result == 'success'
    runs-on: ubuntu-latest
    env:
      # Identificadores del proyecto/Registry existentes y credenciales WIF.
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_ARTIFACT_REGISTRY_REGION }}
      GCP_REPOSITORY: ${{ secrets.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_CICD_SERVICE_ACCOUNT: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # context = directorio de contexto de build del Dockerfile
          # dockerfile = ruta relativa al context
          - name: frontend
            context: Frontend
            dockerfile: Dockerfile
          - name: api-gateway
            context: Backend
            dockerfile: api-gateway/Dockerfile
          - name: auth-service
            context: Backend
            dockerfile: services/auth-service/Dockerfile
          - name: catalog-service
            context: Backend
            dockerfile: services/catalog-service/Dockerfile
          - name: inscripcion-service
            context: Backend
            dockerfile: services/inscripcion-service/Dockerfile
          - name: notificaciones-service
            context: Backend
            dockerfile: services/notificaciones-service/Dockerfile
          - name: reproduccion-service
            context: Backend/services/reproduccion-service
            dockerfile: Dockerfile
          - name: analitica-service
            context: Backend/services/analitica-service
            dockerfile: Dockerfile
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Verificar credenciales del Registry
        env:
          WIF_PROVIDER: ${{ env.GCP_WIF_PROVIDER }}
          CICD_SERVICE_ACCOUNT: ${{ env.GCP_CICD_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$GCP_PROJECT_ID" ]] || missing+=(GCP_PROJECT_ID)
          [[ -n "$GCP_REGION" ]] || missing+=(GCP_ARTIFACT_REGISTRY_REGION)
          [[ -n "$GCP_REPOSITORY" ]] || missing+=(GCP_ARTIFACT_REGISTRY_REPOSITORY)
          [[ -n "$WIF_PROVIDER" ]] || missing+=(GCP_WORKLOAD_IDENTITY_PROVIDER)
          [[ -n "$CICD_SERVICE_ACCOUNT" ]] || missing+=(GCP_CICD_SERVICE_ACCOUNT)

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Falta configuración de GCP/WIF: ${missing[*]}"
            exit 1
          fi
          echo "Configuración de GCP/WIF presente; la publicación continuará."

      - name: Autenticar en Google Cloud mediante WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CICD_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configurar autenticación de Docker
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Calcular etiquetas de imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.GCP_ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REGISTRY_REPOSITORY }}/${{ matrix.name }}
          tags: |
            # Tag de release estándar: v1.3.0 -> :1.3.0 (+ :latest automático)
            type=semver,pattern={{version}}
            # Tag de release histórico: V1.3.0 -> :1.3.0 (+ :latest automático)
            type=match,pattern=V(\d+\.\d+\.\d+),group=1
            # Push a rama: main -> :main
            type=ref,event=branch
            # Garantiza una etiqueta explícita también en workflow_dispatch.
            type=raw,value=${{ needs.resolve-image-tag.outputs.image_tag }}
            # Tag inmutable que consume Kubernetes: commit-<GITHUB_SHA>.
            type=raw,value=commit-${{ github.sha }}
            # SHA del commit para trazabilidad: :sha-<hash>
            type=sha

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          # Rutas absolutas: evita la ambigüedad de si buildx resuelve `file`
          # relativo al context o al directorio de trabajo del runner.
          context: ${{ github.workspace }}/${{ matrix.context }}
          file: ${{ github.workspace }}/${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen de imágenes publicadas
        run: |
          {
            echo "### Imagen \`${{ matrix.name }}\`"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # 4. Despliegue continuo a GKE (producción)
  # ------------------------------------------------------------------
  deploy-k8s:
    name: Deploy — GKE producción
    needs: [publish, resolve-image-tag]
    if: >-
      needs.publish.result == 'success' &&
      needs.resolve-image-tag.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main'))
    runs-on: ubuntu-latest
    concurrency:
      group: yousac-production-gke
      cancel-in-progress: false
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: us-central1
      GKE_CLUSTER_NAME: yousac-prod
      GKE_LOCATION: us-central1
      K8S_NAMESPACE: yousac-prod
      K8S_DOMAIN: yousac-thany.duckdns.org
      IMAGE_TAG: ${{ needs.resolve-image-tag.outputs.immutable_image_tag }}
      REGISTRY_BASE: ${{ secrets.GCP_ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_CICD_SERVICE_ACCOUNT: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}

    steps:
      - name: Obtener código para el despliegue GKE
        uses: actions/checkout@v4

      - name: Verificar configuración GKE y secretos runtime
        env:
          CLOUD_SQL_AUTH: ${{ secrets.CLOUD_SQL_CONNECTION_NAME_AUTH }}
          CLOUD_SQL_CATALOG: ${{ secrets.CLOUD_SQL_CONNECTION_NAME_CATALOG }}
          CLOUD_SQL_REPRODUCCION: ${{ secrets.CLOUD_SQL_CONNECTION_NAME_REPRODUCCION }}
          CLOUD_SQL_ANALITICA: ${{ secrets.CLOUD_SQL_CONNECTION_NAME_ANALITICA }}
          CLOUD_SQL_INSCRIPCION: ${{ secrets.CLOUD_SQL_CONNECTION_NAME_INSCRIPCION }}
          CLOUD_SQL_NOTIFICACIONES: ${{ secrets.CLOUD_SQL_CONNECTION_NAME_NOTIFICACIONES }}
          JWT_SECRET_VALUE: ${{ secrets.JWT_SECRET }}
          DATABASE_URL_AUTH_VALUE: ${{ secrets.DATABASE_URL_AUTH }}
          DATABASE_URL_CATALOG_VALUE: ${{ secrets.DATABASE_URL_CATALOG }}
          DATABASE_URL_REPRODUCCION_VALUE: ${{ secrets.DATABASE_URL_REPRODUCCION }}
          DATABASE_URL_ANALITICA_VALUE: ${{ secrets.DATABASE_URL_ANALITICA }}
          DATABASE_URL_INSCRIPCION_VALUE: ${{ secrets.DATABASE_URL_INSCRIPCION }}
          DATABASE_URL_NOTIFICACIONES_VALUE: ${{ secrets.DATABASE_URL_NOTIFICACIONES }}
          REDIS_URL_VALUE: ${{ secrets.REDIS_URL }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$GCP_PROJECT_ID" ]] || missing+=(GCP_PROJECT_ID)
          [[ -n "$GCP_WIF_PROVIDER" ]] || missing+=(GCP_WORKLOAD_IDENTITY_PROVIDER)
          [[ -n "$GCP_CICD_SERVICE_ACCOUNT" ]] || missing+=(GCP_CICD_SERVICE_ACCOUNT)
          [[ -n "$CLOUD_SQL_AUTH" ]] || missing+=(CLOUD_SQL_CONNECTION_NAME_AUTH)
          [[ -n "$CLOUD_SQL_CATALOG" ]] || missing+=(CLOUD_SQL_CONNECTION_NAME_CATALOG)
          [[ -n "$CLOUD_SQL_REPRODUCCION" ]] || missing+=(CLOUD_SQL_CONNECTION_NAME_REPRODUCCION)
          [[ -n "$CLOUD_SQL_ANALITICA" ]] || missing+=(CLOUD_SQL_CONNECTION_NAME_ANALITICA)
          [[ -n "$CLOUD_SQL_INSCRIPCION" ]] || missing+=(CLOUD_SQL_CONNECTION_NAME_INSCRIPCION)
          [[ -n "$CLOUD_SQL_NOTIFICACIONES" ]] || missing+=(CLOUD_SQL_CONNECTION_NAME_NOTIFICACIONES)
          [[ -n "$JWT_SECRET_VALUE" ]] || missing+=(JWT_SECRET)
          [[ -n "$DATABASE_URL_AUTH_VALUE" ]] || missing+=(DATABASE_URL_AUTH)
          [[ -n "$DATABASE_URL_CATALOG_VALUE" ]] || missing+=(DATABASE_URL_CATALOG)
          [[ -n "$DATABASE_URL_REPRODUCCION_VALUE" ]] || missing+=(DATABASE_URL_REPRODUCCION)
          [[ -n "$DATABASE_URL_ANALITICA_VALUE" ]] || missing+=(DATABASE_URL_ANALITICA)
          [[ -n "$DATABASE_URL_INSCRIPCION_VALUE" ]] || missing+=(DATABASE_URL_INSCRIPCION)
          [[ -n "$DATABASE_URL_NOTIFICACIONES_VALUE" ]] || missing+=(DATABASE_URL_NOTIFICACIONES)
          [[ -n "$REDIS_URL_VALUE" ]] || missing+=(REDIS_URL)

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Falta configuración requerida de GKE: ${missing[*]}"
            exit 1
          fi
          echo "Configuración GKE y secretos requeridos presentes."

      - name: Autenticar en Google Cloud mediante WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CICD_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configurar gcloud y plugin de autenticación GKE
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: Obtener credenciales del clúster GKE
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER_NAME }}
          location: ${{ env.GKE_LOCATION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Aplicar versión inmutable en GKE
        env:
          CLOUD_SQL_CONNECTION_NAME_AUTH: ${{ secrets.CLOUD_SQL_CONNECTION_NAME_AUTH }}
          CLOUD_SQL_CONNECTION_NAME_CATALOG: ${{ secrets.CLOUD_SQL_CONNECTION_NAME_CATALOG }}
          CLOUD_SQL_CONNECTION_NAME_REPRODUCCION: ${{ secrets.CLOUD_SQL_CONNECTION_NAME_REPRODUCCION }}
          CLOUD_SQL_CONNECTION_NAME_ANALITICA: ${{ secrets.CLOUD_SQL_CONNECTION_NAME_ANALITICA }}
          CLOUD_SQL_CONNECTION_NAME_INSCRIPCION: ${{ secrets.CLOUD_SQL_CONNECTION_NAME_INSCRIPCION }}
          CLOUD_SQL_CONNECTION_NAME_NOTIFICACIONES: ${{ secrets.CLOUD_SQL_CONNECTION_NAME_NOTIFICACIONES }}
          K8S_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          K8S_DATABASE_URL_AUTH: ${{ secrets.DATABASE_URL_AUTH }}
          K8S_DATABASE_URL_CATALOG: ${{ secrets.DATABASE_URL_CATALOG }}
          K8S_DATABASE_URL_REPRODUCCION: ${{ secrets.DATABASE_URL_REPRODUCCION }}
          K8S_DATABASE_URL_ANALITICA: ${{ secrets.DATABASE_URL_ANALITICA }}
          K8S_DATABASE_URL_INSCRIPCION: ${{ secrets.DATABASE_URL_INSCRIPCION }}
          K8S_DATABASE_URL_NOTIFICACIONES: ${{ secrets.DATABASE_URL_NOTIFICACIONES }}
          K8S_REDIS_URL: ${{ secrets.REDIS_URL }}
          K8S_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          K8S_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          K8S_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          K8S_SMTP_USER: ${{ secrets.SMTP_USER }}
          K8S_SMTP_PASS: ${{ secrets.SMTP_PASS }}
          K8S_SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: bash deploy/k8s-deploy.sh

      - name: Publicar resumen de GKE
        run: |
          {
            echo "### Deploy automático a GKE"
            echo "- Cluster: \`$GKE_CLUSTER_NAME\`"
            echo "- Namespace: \`$K8S_NAMESPACE\`"
            echo "- Etiqueta inmutable: \`$IMAGE_TAG\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- URL: \`https://$K8S_DOMAIN\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnóstico si falla el despliegue GKE
        if: failure()
        run: |
          set +e
          kubectl get deployments,pods,services -n "$K8S_NAMESPACE" -o wide
          kubectl get events -n "$K8S_NAMESPACE" --sort-by=.lastTimestamp
          kubectl describe pods -n "$K8S_NAMESPACE" -l app.kubernetes.io/part-of=yousac
          kubectl logs -n "$K8S_NAMESPACE" -l app.kubernetes.io/part-of=yousac \
            --all-containers --prefix --tail=100

  # ------------------------------------------------------------------
  # 5. Despliegue continuo a la VM de desarrollo
  # ------------------------------------------------------------------
  deploy:
    name: Deploy — VM de desarrollo
    needs: [publish, resolve-image-tag]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.publish.result == 'success' && needs.resolve-image-tag.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: yousac-development-vm
      cancel-in-progress: false
    env:
      DEPLOY_DIR: /opt/yousac
      IMAGE_TAG: ${{ needs.resolve-image-tag.outputs.image_tag }}
      REGISTRY_HOST: ${{ secrets.GCP_ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev
      REGISTRY_BASE: ${{ secrets.GCP_ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      CLOUD_BASE_URL: ${{ vars.CLOUD_BASE_URL }}

    steps:
      - name: Obtener código para el despliegue
        uses: actions/checkout@v4

      - name: Verificar configuración de despliegue
        env:
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$VM_HOST" ]] || missing+=(VM_HOST)
          [[ -n "$VM_USER" ]] || missing+=(VM_USER)
          [[ -n "$VM_KNOWN_HOSTS" ]] || missing+=(VM_KNOWN_HOSTS)
          [[ -n "$CLOUD_BASE_URL" ]] || missing+=(CLOUD_BASE_URL)
          [[ -n "$REGISTRY_HOST" ]] || missing+=(GCP_ARTIFACT_REGISTRY_REGION)
          [[ -n "$REGISTRY_BASE" ]] || missing+=(GCP_PROJECT_ID/GCP_ARTIFACT_REGISTRY_REPOSITORY)

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Falta configuración de CD: ${missing[*]}"
            exit 1
          fi

      - name: Configurar clave SSH y host keys
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]] || { echo "::error::Falta VM_SSH_KEY"; exit 1; }
          [[ -n "$SSH_KNOWN_HOSTS" ]] || { echo "::error::Falta VM_KNOWN_HOSTS"; exit 1; }

          umask 077
          SSH_KEY_PATH="$RUNNER_TEMP/yousac-deploy-key"
          KNOWN_HOSTS_PATH="$RUNNER_TEMP/yousac-known-hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_KEY_PATH"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$KNOWN_HOSTS_PATH"
          chmod 600 "$SSH_KEY_PATH" "$KNOWN_HOSTS_PATH"

          ssh-keygen -y -f "$SSH_KEY_PATH" > /dev/null
          test -s "$KNOWN_HOSTS_PATH"
          echo "SSH_KEY_PATH=$SSH_KEY_PATH" >> "$GITHUB_ENV"
          echo "KNOWN_HOSTS_PATH=$KNOWN_HOSTS_PATH" >> "$GITHUB_ENV"

      - name: Copiar manifiestos de despliegue a la VM
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i "$SSH_KEY_PATH"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS_PATH"
            -o ConnectTimeout=15
          )
          REMOTE_STAGING_DIR="/tmp/yousac-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          ssh "${SSH_OPTS[@]}" "$VM_USER@$VM_HOST" \
            bash -s -- "$REMOTE_STAGING_DIR" <<'REMOTE_PREPARE'
          set -euo pipefail
          remote_staging_dir="$1"
          mkdir -p "$remote_staging_dir/deploy"
          REMOTE_PREPARE
          scp "${SSH_OPTS[@]}" docker-compose.cloud.yml \
            "$VM_USER@$VM_HOST:$REMOTE_STAGING_DIR/"
          scp "${SSH_OPTS[@]}" deploy/Caddyfile deploy/Caddyfile.vm \
            "$VM_USER@$VM_HOST:$REMOTE_STAGING_DIR/deploy/"

          echo "REMOTE_STAGING_DIR=$REMOTE_STAGING_DIR" >> "$GITHUB_ENV"

      - name: Ejecutar despliegue remoto sin compilación
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -i "$SSH_KEY_PATH"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS_PATH"
            -o ConnectTimeout=15
          )

          ssh "${SSH_OPTS[@]}" "$VM_USER@$VM_HOST" \
            bash -s -- "$REMOTE_STAGING_DIR" "$DEPLOY_DIR" "$IMAGE_TAG" "$REGISTRY_HOST" "$REGISTRY_BASE" <<'REMOTE_SCRIPT'
          set -euo pipefail

          REMOTE_STAGING_DIR="$1"
          DEPLOY_DIR="$2"
          IMAGE_TAG="$3"
          REGISTRY_HOST="$4"
          REGISTRY_BASE="$5"

          : "${REMOTE_STAGING_DIR:?Falta el directorio temporal remoto}"
          : "${DEPLOY_DIR:?Falta el directorio de despliegue}"
          : "${IMAGE_TAG:?Falta la etiqueta de imagen}"
          : "${REGISTRY_HOST:?Falta el host del Registry}"
          : "${REGISTRY_BASE:?Falta la base del Registry}"

          sudo -n true
          command -v docker >/dev/null
          sudo docker compose version >/dev/null
          command -v gcloud >/dev/null
          command -v curl >/dev/null
          test -s "$DEPLOY_DIR/.env.cloud"

          sudo install -d -m 0755 "$DEPLOY_DIR" "$DEPLOY_DIR/deploy"
          sudo install -m 0644 "$REMOTE_STAGING_DIR/docker-compose.cloud.yml" \
            "$DEPLOY_DIR/docker-compose.cloud.yml"
          sudo install -m 0644 "$REMOTE_STAGING_DIR/deploy/Caddyfile" \
            "$DEPLOY_DIR/deploy/Caddyfile"
          sudo install -m 0644 "$REMOTE_STAGING_DIR/deploy/Caddyfile.vm" \
            "$DEPLOY_DIR/deploy/Caddyfile.vm"

          # La identidad adjunta a Compute Engine obtiene permisos de lectura
          # sobre Artifact Registry; no se instala ninguna llave JSON en la VM.
          sudo gcloud auth configure-docker "$REGISTRY_HOST" --quiet

          COMPOSE=(
            sudo env "REGISTRY_BASE=$REGISTRY_BASE" "IMAGE_TAG=$IMAGE_TAG"
            docker compose
            --env-file "$DEPLOY_DIR/.env.cloud"
            -f "$DEPLOY_DIR/docker-compose.cloud.yml"
          )

          "${COMPOSE[@]}" config --quiet
          "${COMPOSE[@]}" pull
          "${COMPOSE[@]}" up -d --no-build --remove-orphans

          for attempt in {1..24}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health >/dev/null \
              && curl --fail --silent --show-error http://127.0.0.1:8081/healthz >/dev/null; then
              echo "Gateway y frontend saludables después del despliegue."
              "${COMPOSE[@]}" ps
              exit 0
            fi
            echo "Esperando servicios saludables (intento $attempt/24)..."
            sleep 5
          done

          "${COMPOSE[@]}" ps
          echo "::error::La VM no alcanzó los health checks después del despliegue."
          exit 1
          REMOTE_SCRIPT

      - name: Validar endpoint público
        run: |
          set -euo pipefail
          PUBLIC_HEALTH_URL="${CLOUD_BASE_URL%/}/api/health"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            --retry-all-errors "$PUBLIC_HEALTH_URL"
          echo
          echo "Endpoint público saludable: $PUBLIC_HEALTH_URL"

      - name: Resumen del despliegue
        run: |
          {
            echo "### Deploy automático a la VM"
            echo "- Etiqueta de imagen: \`$IMAGE_TAG\`"
            echo "- Registro: \`$REGISTRY_BASE\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Validación pública: \`${CLOUD_BASE_URL%/}/api/health\`"
            echo "- Actualización realizada con \`docker compose pull\` y \`up --no-build\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpiar archivos temporales de la VM
        if: always()
        run: |
          set -euo pipefail
          if [[ -z "${REMOTE_STAGING_DIR:-}" || -z "${SSH_KEY_PATH:-}" || -z "${KNOWN_HOSTS_PATH:-}" ]]; then
            exit 0
          fi
          SSH_OPTS=(
            -i "$SSH_KEY_PATH"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS_PATH"
            -o ConnectTimeout=10
          )
          ssh "${SSH_OPTS[@]}" "$VM_USER@$VM_HOST" \
            rm -rf -- "$REMOTE_STAGING_DIR" || true
