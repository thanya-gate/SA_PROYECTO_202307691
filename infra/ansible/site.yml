---
# site.yml - Punto de entrada unico.
#   ansible-playbook -i inventory.ini site.yml
#
# Orden:
#   base         -> todas las VMs (hardening, paquetes, usuarios)
#   docker       -> VM de desarrollo (Docker Engine + Compose)
#   monitoring   -> todas las VMs (node-exporter + Fluent Bit -> Logstash)
#   elk          -> VM de observabilidad (Elasticsearch + Logstash + Kibana)
- name: Configuracion base de todas las VMs
  import_playbook: playbooks/base.yml

- name: Docker y Docker Compose en el entorno de desarrollo
  import_playbook: playbooks/docker.yml

- name: Agentes de observabilidad (metricas y logs) en todas las VMs
  import_playbook: playbooks/monitoring.yml

- name: Stack ELK (Elasticsearch, Logstash y Kibana) en la capa de datos
  import_playbook: playbooks/elk.yml
