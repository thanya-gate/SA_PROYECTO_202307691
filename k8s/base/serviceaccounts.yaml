apiVersion: v1
kind: ServiceAccount
metadata:
  name: yousac-runtime
  labels:
    app.kubernetes.io/part-of: yousac
  annotations:
    # Se enlaza con el GSA que posee roles/cloudsql.client. El valor se
    # sustituye en el overlay/entorno real según la cuenta creada en GCP.
    iam.gke.io/gcp-service-account: yousac-cloudsql-proxy@yousac-202300396-2026.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: yousac-gateway
  labels:
    app.kubernetes.io/part-of: yousac
  annotations:
    # El Gateway usa ADC/Workload Identity para Cloud Storage.
    iam.gke.io/gcp-service-account: yousac-gateway-storage@yousac-202300396-2026.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: yousac-frontend
  labels:
    app.kubernetes.io/part-of: yousac
