apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yousac-public
  labels:
    app.kubernetes.io/part-of: yousac
  annotations:
    kubernetes.io/ingress.class: gce
    networking.gke.io/managed-certificates: yousac-managed-cert
    kubernetes.io/ingress.global-static-ip-name: yousac-prod-ip
spec:
  rules:
    - host: yousac-thany.duckdns.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /mock-oauth
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /federation
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    # Kibana vive en la VM de observabilidad (capa de datos). El Service/Endpoints
    # `kibana` puentea el Ingress hacia 10.20.3.10:5601 por el peering VPC.
    - host: kibana.yousac-thany.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kibana
                port:
                  number: 5601
    # Grafana (kube-prometheus-stack) se instala con namespaceOverride en yousac-prod.
    - host: grafana.yousac-thany.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
