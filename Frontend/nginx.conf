server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolver de Docker: permite re-resolver api-gateway en cada request
    # (evita 502 cuando el contenedor del gateway es recreado y cambia de IP).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_gateway http://api-gateway:8080;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        return 200;
    }

    # Videos subidos a la plataforma (volumen media-data montado en
    # /usr/share/nginx/html/media). nginx sirve archivos estáticos con
    # soporte de HTTP Range (streaming/seek del <video>).
    location /media/ {
        try_files $uri =404;
        add_header Accept-Ranges bytes;
        expires 1d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
