server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://127.0.0.1:8080;

    # API Gateway proxy — strip /api prefix (api-gateway expects /auth/oauth/...)
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Mock OAuth IdP proxy (solo para mock provider)
    location /mock-oauth/ {
        rewrite ^/mock-oauth/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /healthz {
        return 200;
    }

    # SPA fallback — maneja /oauth/callback (ruta React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
