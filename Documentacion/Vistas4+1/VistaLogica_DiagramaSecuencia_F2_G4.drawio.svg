<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1900" height="2200" viewBox="0 0 1900 2200" role="img" aria-labelledby="title desc">
  <title id="title">Vista lógica Fase 2</title>
  <desc id="desc">Secuencia lógica consolidada de los cinco casos de uso del módulo de aprendizaje interactivo y recursos.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/>
    </marker>
    <style>
      .canvas { fill:#121212; stroke:#FFFFFF; stroke-width:1; }
      .box { fill:#121212; stroke:#FFFFFF; stroke-width:1.5; }
      .text { fill:#FFFFFF; font-family:Arial,Helvetica,sans-serif; font-size:13px; }
      .title { fill:#FFFFFF; font-family:Arial,Helvetica,sans-serif; font-size:24px; font-weight:700; }
      .subtitle { fill:#FFFFFF; font-family:Arial,Helvetica,sans-serif; font-size:13px; }
      .section { fill:#FFFFFF; font-family:Arial,Helvetica,sans-serif; font-size:16px; font-weight:700; }
      .line { stroke:#FFFFFF; stroke-width:1; stroke-dasharray:6 6; }
      .message { stroke:#FFFFFF; stroke-width:1.4; marker-end:url(#arrow); }
      .return { stroke:#FFFFFF; stroke-width:1.2; stroke-dasharray:6 6; marker-end:url(#arrow); }
      .label { fill:#121212; }
      .labelText { fill:#FFFFFF; font-family:Arial,Helvetica,sans-serif; font-size:12px; text-anchor:middle; }
      .footer { fill:#FFFFFF; font-family:Arial,Helvetica,sans-serif; font-size:12px; font-style:italic; text-anchor:middle; }
    </style>
  </defs>
  <rect class="canvas" x="20" y="20" width="1860" height="2160"/>
  <text class="title" x="950" y="59" text-anchor="middle">VISTA LÓGICA · FASE 2</text>
  <text class="subtitle" x="950" y="91" text-anchor="middle">Módulo 7: Aprendizaje interactivo y recursos · CDU0007.1–CDU0007.5</text>

