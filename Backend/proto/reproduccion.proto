syntax = "proto3";

package yousac.reproduccion.v1;

option java_multiple_files = true;
option go_package = "yousac.com/yousac/reproduccion-service/gen/reproduccionv1;reproduccionv1";

// =====================================================================
// Microservicio de Reproducción (YoUSAC) — Go
// Contrato gRPC para el tráfico east-west entre microservicios (RNF-06).
// Registra la reproducción, marcas de tiempo (checkpoints de avance) y
// el historial reciente ligado a la cuenta institucional del estudiante.
// El API Gateway expone el north-south (HTTP) al cliente web y traduce
// cada petición a una llamada gRPC de este contrato.
// =====================================================================

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string service = 2;
  string version = 3;
}

// Punto de reanudación de una clase (segundo exacto donde se pausó).
message Checkpoint {
  string historial_id = 1;
  string clase_id = 2;
  int32 segundo_actual = 3;
  int32 duracion = 4;
  double porcentaje_avance = 5; // 0.00 - 100.00
  string fecha_actualizacion = 6;
}

message GuardarCheckpointRequest {
  string estudiante_id = 1;
  string clase_id = 2;
  int32 segundo_actual = 3;
  int32 duracion = 4;
}

message GuardarCheckpointResponse {
  string historial_id = 1;
  double porcentaje_avance = 2;
}

message ObtenerCheckpointRequest {
  string estudiante_id = 1;
  string clase_id = 2;
}

message ObtenerCheckpointResponse {
  Checkpoint checkpoint = 1;
}

message HistorialItem {
  string clase_id = 1;
  string fecha_ultima_visualizacion = 2;
  int32 segundo_actual = 3;
  int32 duracion = 4;
  double porcentaje_avance = 5;
  bool tiene_checkpoint = 6;
}

message HistorialRecienteRequest {
  string estudiante_id = 1;
}

message HistorialRecienteResponse {
  repeated HistorialItem items = 1;
}

message RegistrarCalificacionRequest {
  string historial_id = 1;
  int32 puntuacion = 2; // 1..5
  string comentario = 3;
}

message RegistrarCalificacionResponse {
  bool registrada = 1;
}

// Cuaderno de apuntes Markdown con marcadores de tiempo ([MM:SS]) ligado al
// estudiante y a una clase. El contenido se almacena como Markdown enriquecido
// y los marcadores de tiempo permiten saltar a un segundo exacto del video.
message Apunte {
  string apunte_id = 1;
  string estudiante_id = 2;
  string clase_id = 3;
  string titulo = 4;
  string contenido_markdown = 5; // Markdown con marcadores de tiempo [MM:SS]
  string fecha_creacion = 6;
  string fecha_actualizacion = 7;
}

message GuardarApunteRequest {
  string estudiante_id = 1;
  string clase_id = 2;
  string titulo = 3;
  string contenido_markdown = 4;
}

message GuardarApunteResponse {
  Apunte apunte = 1;
}

message ObtenerApunteRequest {
  string estudiante_id = 1;
  string clase_id = 2;
}

message ObtenerApunteResponse {
  Apunte apunte = 1;
}

message ListarApuntesRequest {
  string estudiante_id = 1;
}

message ListarApuntesResponse {
  repeated Apunte apuntes = 1;
}

message EliminarApunteRequest {
  string estudiante_id = 1;
  string clase_id = 2;
}

message EliminarApunteResponse {
  bool eliminado = 1;
}

service ReproduccionService {
  rpc Health(HealthRequest) returns (HealthResponse);

  // --- Reproducción / checkpoint ---
  rpc GuardarCheckpoint(GuardarCheckpointRequest) returns (GuardarCheckpointResponse);
  rpc ObtenerCheckpoint(ObtenerCheckpointRequest) returns (ObtenerCheckpointResponse);

  // --- Historial de reproducción reciente ---
  rpc HistorialReciente(HistorialRecienteRequest) returns (HistorialRecienteResponse);

  // --- Valoraciones ---
  rpc RegistrarCalificacion(RegistrarCalificacionRequest) returns (RegistrarCalificacionResponse);

  // --- Cuaderno de apuntes Markdown con marcadores de tiempo ---
  rpc GuardarApunte(GuardarApunteRequest) returns (GuardarApunteResponse);
  rpc ObtenerApunte(ObtenerApunteRequest) returns (ObtenerApunteResponse);
  rpc ListarApuntes(ListarApuntesRequest) returns (ListarApuntesResponse);
  rpc EliminarApunte(EliminarApunteRequest) returns (EliminarApunteResponse);
}
