apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush 5
        Grace 45
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers-yousac.conf
        storage.path /buffers/storage
        storage.sync full
        storage.backlog.flush_on_shutdown On
        storage.backlog.mem_limit 8M
    [INPUT]
        Name tail
        Path /var/log/containers/*_yousac-prod_*.log
        Tag kube.*
        Parser cri
        DB /buffers/tail.db
        Read_from_Head Off
        Refresh_Interval 5
        Mem_Buf_Limit 16M
        Skip_Long_Lines On
        storage.type filesystem
    [FILTER]
        Name kubernetes
        Match kube.*
        Kube_Tag_Prefix kube.var.log.containers.
        Use_Tag_For_Meta On
        Labels Off
        Annotations Off
        Merge_Log Off
    [FILTER]
        Name record_modifier
        Match *
        Record source yousac-gke
        Record environment production
    [OUTPUT]
        Name tcp
        Match *
        Host 10.20.3.10
        Port 5044
        Format json_lines
        Retry_Limit False
        storage.total_limit_size 448M
  parsers-yousac.conf: |
    [PARSER]
        Name cri
        Format regex
        Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep On
